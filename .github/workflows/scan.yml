name: Strict Crypto Scanner

on:
  schedule:
    # Setiap jam tepat (UTC)
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Soft install: apt mirror sometimes fails — scanner still runs (text-only Square)
      - name: Install SVG renderer (Square card)
        continue-on-error: true
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq librsvg2-bin || echo "rsvg missing — Square will post text only"

      - name: Run Strict Scanner
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BINANCE_SQUARE_OPENAPI_KEY: ${{ secrets.BINANCE_SQUARE_OPENAPI_KEY }}
        run: node scanner.js

      # Persist outcome log so next hourly run can evaluate open signals
      - name: Commit signals-log.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f signals-log.json ]; then
            git add signals-log.json
            if git diff --staged --quiet; then
              echo "No outcome log changes"
            else
              git commit -m "chore: update signals-log outcome tracker"
              git push
            fi
          else
            echo "No signals-log.json yet"
          fi
