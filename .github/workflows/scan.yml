name: Strict Crypto Scanner

on:
  push:
    branches:
      - main
    paths-ignore:
      - signals-log.json
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: crypto-signal-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Verify modules
        run: |
          node --check scanner.js
          node --check ai_moderator.js
          node --check scanner_engine.js
          node --check delivery.js
          node --check trade_plan.js
          npm test

      - name: Cache Qwen3 model
        if: github.event_name != 'pull_request'
        uses: actions/cache@v4
        with:
          path: models
          key: qwen3-0.6b-q4-k-m-3479875d3e4c726f7a20b2181f5e1536aefe9925f284f9ae9997a39a7e0d8dc9

      - name: Prepare local Qwen3
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: bash scripts/start_qwen.sh

      - name: Install SVG renderer (Square card)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin

      - name: Run scanner
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BINANCE_SQUARE_OPENAPI_KEY: ${{ secrets.BINANCE_SQUARE_OPENAPI_KEY }}
          SCANNER_DRY_RUN: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
          AI_MAX_CANDIDATES: 3
          SCANNER_INTERVAL: "1h"
          SCANNER_CANDLES: "150"
          SCANNER_UNIVERSE: "300"
          SCANNER_CANDIDATES: "20"
          SCANNER_MIN_VOLUME: "0"
          SCANNER_BATCH: "3"
          SCANNER_MIN_CONSENSUS: "45"
          SCANNER_DEEP_CANDIDATES: "10"
          QWEN_BASE_URL: "http://127.0.0.1:11434/v1"
          QWEN_MODEL: "qwen3-0.6b"
          SCANNER_PROVIDER: "bitget"
          QWEN_SCAN_BATCH_SIZE: "10"
          QWEN_TIMEOUT_MS: "45000"
          QWEN_RETRIES: "1"
        run: node scanner.js

      - name: Commit signals-log.json safely
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f signals-log.json ]; then
            cp signals-log.json /tmp/signals-log-run.json
            git add signals-log.json
            if git diff --staged --quiet; then
              echo "No outcome log changes"
              exit 0
            fi
            git commit -m "chore: update signals-log outcome tracker"
            if ! git pull --rebase origin main; then
              echo "signals-log changed upstream; merging outcome state instead of failing the run"
              git checkout --ours signals-log.json
              node <<'NODE'
const fs=require("fs");
const remote=JSON.parse(fs.readFileSync("signals-log.json","utf8"));
const run=JSON.parse(fs.readFileSync("/tmp/signals-log-run.json","utf8"));
const merge=(a,b)=>{
  const out=[],seen=new Set();
  for(const x of [...(a||[]),...(b||[])]) {
    const k=String(x?.fingerprint||x?.id||[x?.base,x?.action,x?.ts].join("|"));
    if(!seen.has(k)){seen.add(k);out.push(x);}
  }
  return out;
};
const merged={
  open:merge(remote.open,run.open),
  closed:merge(remote.closed,run.closed),
  stats:{...(remote.stats||{}),...(run.stats||{})}
};
fs.writeFileSync("signals-log.json",JSON.stringify(merged,null,2)+"\n");
NODE
              git add signals-log.json
              GIT_EDITOR=true git rebase --continue
            fi
            git push
          fi
