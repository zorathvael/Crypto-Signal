name: Strict Crypto Scanner

on:
  push:
    branches:
      - main
    paths-ignore:
      - signals-log.json
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: crypto-signal-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Verify modules
        run: |
          node --check scanner.js
          node --check ai_moderator.js
          node --check scanner_engine.js
          node --check delivery.js
          node --check trade_plan.js
          npm test

      - name: Cache Qwen3 model
        if: github.event_name != 'pull_request'
        uses: actions/cache@v4
        with:
          path: models
          key: qwen3-0.6b-q4-k-m-3479875d3e4c726f7a20b2181f5e1536aefe9925f284f9ae9997a39a7e0d8dc9

      - name: Prepare local Qwen3
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: bash scripts/start_qwen.sh

      - name: Install SVG renderer (Square card)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin

      - name: Run scanner
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BINANCE_SQUARE_OPENAPI_KEY: ${{ secrets.BINANCE_SQUARE_OPENAPI_KEY }}
          SCANNER_DRY_RUN: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
          AI_MAX_CANDIDATES: 3
          SCANNER_INTERVAL: "1h"
          SCANNER_CANDLES: "150"
          SCANNER_UNIVERSE: "300"
          SCANNER_CANDIDATES: "20"
          SCANNER_MIN_VOLUME: "0"
          SCANNER_BATCH: "3"
          SCANNER_MIN_CONSENSUS: "45"
          SCANNER_DEEP_CANDIDATES: "10"
          QWEN_BASE_URL: "http://127.0.0.1:11434/v1"
          QWEN_MODEL: "qwen3-0.6b"
          SCANNER_PROVIDER: "bitget"
          QWEN_SCAN_BATCH_SIZE: "10"
          QWEN_TIMEOUT_MS: "45000"
          QWEN_RETRIES: "1"
        run: node scanner.js

      - name: Research entry → TP1/SL outcomes
        env:
          BITGET_API_BASE: https://api.bitget.com
          RESEARCH_MAX_SIGNALS: "100"
        run: node entry_outcome_research.js

      - name: Commit signals-log.json
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f signals-log.json ]; then
            # Scanner state is generated during the run. Rebase after committing it
            # causes JSON conflicts whenever main advances during the scan. Instead,
            # refresh main first, then merge the generated state by signal id.
            cp signals-log.json /tmp/signals-log.scan.json
            cp entry-outcome-research.json /tmp/entry-outcome-research.scan.json
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/entry-outcome-research.scan.json entry-outcome-research.json

            node <<'NODE'
          const fs = require("fs");
          const local = JSON.parse(fs.readFileSync("/tmp/signals-log.scan.json", "utf8"));
          const remote = fs.existsSync("signals-log.json")
            ? JSON.parse(fs.readFileSync("signals-log.json", "utf8"))
            : {};
          for (const key of ["open", "closed"]) {
            const merged = new Map();
            for (const item of Array.isArray(remote[key]) ? remote[key] : []) {
              if (item && item.id) merged.set(item.id, item);
            }
            for (const item of Array.isArray(local[key]) ? local[key] : []) {
              if (item && item.id) merged.set(item.id, item);
            }
            remote[key] = Array.from(merged.values()).sort((a, b) =>
              Number(a.ts || 0) - Number(b.ts || 0) ||
              String(a.id).localeCompare(String(b.id))
            );
          }
          fs.writeFileSync("signals-log.json", JSON.stringify(remote, null, 2) + "\n");
          NODE

            git add signals-log.json entry-outcome-research.json
            if git diff --staged --quiet; then
              echo "No outcome log changes"
            else
              git commit -m "chore: update signals-log outcome tracker"
              git push origin HEAD:main
            fi
          fi
