name: Strict Crypto Scanner

on:
  schedule:
    # Setiap jam tepat (UTC)
    - cron: "0 * * * *"
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify modules
        run: |
          node --check positioning.js
          node --check traderspy.js
          node --check scanner.js
          npm test

      - name: Install SVG renderer (Square card)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq librsvg2-bin || echo "rsvg missing — Square will post text only"

      - name: Run Strict Scanner
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BINANCE_SQUARE_OPENAPI_KEY: ${{ secrets.BINANCE_SQUARE_OPENAPI_KEY }}
          TRADERSPY_ONLY: "true"
          TRADERSPY_MCP_URL: ${{ secrets.TRADERSPY_MCP_URL }}
          TRADERSPY_MCP_TOKEN: ${{ secrets.TRADERSPY_MCP_TOKEN }}
          TRADERSPY_SIGNAL_LIMIT: "50"
          TRADERSPY_MAX_AGE_MIN: "120"
          TRADERSPY_CANDIDATE_MAX_AGE_MIN: "360"
          TRADERSPY_DISCOVERY_UNIVERSE: "100"
          TRADERSPY_DISCOVERY_LIMIT: "50"
          TRADERSPY_VALIDATION_TARGETS: "3"
          TRADERSPY_VALIDATION_MIN_SCORE: "88"
          TRADERSPY_STALE_MIN_SCORE: "90"
          TRADERSPY_MIN_SCORE: "80"
        run: node scanner.js

      - name: Commit signals-log.json
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f signals-log.json ]; then
            git add signals-log.json
            if git diff --staged --quiet; then
              echo "No outcome log changes"
            else
              git commit -m "chore: update signals-log outcome tracker"
              git push
            fi
          else
            echo "No signals-log.json yet"
          fi
