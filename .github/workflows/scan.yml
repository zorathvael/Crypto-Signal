name: Strict Crypto Scanner

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Verify modules
        run: |
          node --check scanner.js
          node --check ai_moderator.js
          node --check scanner_engine.js
          node --check delivery.js
          node --check trade_plan.js
          npm test

      - name: Install SVG renderer (Square card)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin

      - name: Run scanner
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BINANCE_SQUARE_OPENAPI_KEY: ${{ secrets.BINANCE_SQUARE_OPENAPI_KEY }}
          SCANNER_DRY_RUN: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
          AI_MAX_CANDIDATES: 3
          SCANNER_INTERVAL: "5m"
          SCANNER_CANDLES: "120"
          SCANNER_UNIVERSE: "30"
          SCANNER_CANDIDATES: "10"
          SCANNER_MIN_VOLUME: "15000000"
          SCANNER_BATCH: "6"
          SCANNER_MIN_CONSENSUS: "52"
          SCANNER_MARKET_DATA: "bitget"
          SCANNER_DEEP_CANDIDATES: "10"
        run: node scanner.js

      - name: Commit signals-log.json
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f signals-log.json ]; then
            git add signals-log.json
            if git diff --staged --quiet; then
              echo "No outcome log changes"
            else
              git commit -m "chore: update signals-log outcome tracker"
              git push
            fi
          fi
